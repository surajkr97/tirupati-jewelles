# Rewritten by Phase 1 (specs/01-cleanup-scaffold.md §1.3).
#
# Replaces the pre-rebuild pair of compose files (root + server/) and their `include:`
# indirection with one file. The FastAPI `api` service is gone; the Celery worker stays as
# dormant infrastructure and must not be removed.
#
# SEC-001: Postgres and Redis bind to 127.0.0.1 ONLY.
#
# The pre-rebuild file used `6379:6379`, which Docker expands to 0.0.0.0:6379 — an
# unauthenticated Redis on every interface, remotely reachable from any machine on the
# same wifi. `127.0.0.1:6379:6379` publishes to loopback only, so `pnpm dev` on the host
# still connects while nothing off-box can. Redis additionally now requires a password.
#
# Do not drop the 127.0.0.1 prefix when editing this file.

name: tirupati-jewelles

services:
  db:
    container_name: tirupati-db
    image: postgres:16
    restart: unless-stopped
    environment:
      # SEC-002: credentials come from .env. The old fastapi_user/fastapi123 pair was
      # hardcoded here and is committed in git history — it has been rotated, not moved.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Persistence is enabled deliberately, and it is not only a cache — Phase 9 §9.5 ──
  #
  # `--requirepass` on the command line means Redis starts with NO config file, so it took
  # the built-in defaults: RDB only, at `save 3600 1 / 300 100 / 60 10000`. Measured before
  # this change, not assumed — a key written and then SIGKILLed away was gone on restart and
  # `DBSIZE` came back at the pre-write figure, i.e. the last snapshot. With this shop's
  # write volume the 100-changes-in-300s and 10000-in-60s rules never fire, so the real
  # durability window was the ONE HOUR rule.
  #
  # What is in here decides whether that matters, and this instance holds three things:
  #
  #   session:{id}       Phase 3 §3.3 — the session store. Losing it signs everyone out,
  #                      including an admin halfway through raising a bill.
  #   rl:{...}           the rate-limit counters. `lib/auth/rate-limit.ts` FAILS CLOSED, so
  #                      losing these is safe in the direction that matters.
  #   rates:*, search:*  ordinary cache-aside. Losing these costs a Postgres query.
  #
  # Only the third is a cache. So AOF with `everysec`: the durability window goes from up
  # to an hour to at most a second, at the cost of one background fsync per second. The RDB
  # save points are LEFT ON — with `appendonly yes` Redis loads the AOF on start and the RDB
  # becomes a cheap point-in-time file, which is what `docker compose exec redis redis-cli
  # BGSAVE` produces for a restore.
  #
  # `maxmemory-policy` is deliberately left at `noeviction`. The cache-shaped default
  # (`allkeys-lru`) would evict SESSIONS under pressure, which reads to a customer as being
  # randomly signed out; failing a write loudly is the better error.
  redis:
    container_name: tirupati-redis
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      # The healthcheck needs the password; it is already in this container's env.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Dormant infrastructure — specs/01-cleanup-scaffold.md §1.3 and
  # backend/celery_app/README.md. It connects, logs "ready", and does nothing else.
  # DO NOT DELETE. Phase 9 §9.3 gives it real work.
  worker:
    container_name: tirupati-worker
    build:
      context: ./backend
    restart: unless-stopped
    command: ['celery', '-A', 'celery_app.celery', 'worker', '--loglevel=info']
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # Phase 9 §9.3. The Node job worker — see D-042 for why the jobs run here and not in
  # `worker` above, which stays dormant and must not be deleted.
  #
  # Not built from a Dockerfile: there is no production image for the Next app in this repo
  # (Render builds it), so this runs the same `pnpm worker` a developer runs, against the
  # same compose network. It is here so `docker compose up` gives a complete local system.
  jobs:
    container_name: tirupati-jobs
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command:
      ['sh', '-c', 'corepack enable && pnpm install --frozen-lockfile && pnpm worker']
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ..:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    profiles:
      # Off by default. `pnpm worker` on the host is the normal development path; this
      # service exists for "does the whole system come up from nothing" and would otherwise
      # reinstall node_modules into a bind mount on every `docker compose up`.
      - jobs

volumes:
  pgdata:
  redisdata:
