# Rewritten by Phase 1 (specs/01-cleanup-scaffold.md).
#
# Replaces the pytest workflow that tested the deleted FastAPI app. Service containers for
# Postgres and Redis mirror docker-compose so the suite exercises the real cache-aside path
# rather than a mock.

name: Tests

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master, v2]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # CI-only throwaway values. lib/env.ts throws at boot on anything missing, so the
      # full MASTER-SPEC §9 set has to be present even for a unit-test run.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # `schema.prisma` resolves `directUrl = env("MIGRATE_DATABASE_URL")`, so EVERY prisma
      # command needs it — not only the ones that migrate. Phase 9 §9.1 split the runtime and
      # migration roles (SEC-029) and this file was not updated to match, so `migrate deploy`
      # died with P1012 before a single test ran. CI has one database and one user, so both
      # URLs point at it; the split is a production control, not a CI one.
      MIGRATE_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-session-secret-that-is-long-enough-32b
      OTP_PEPPER: ci-otp-pepper-that-is-long-enough-32-bytes
      EMAIL_FROM: Tirupati Jewelles <ci@example.com>
      ALLOWED_IMAGE_HOSTS: res.cloudinary.com,utfs.io
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-admin-password
      NEXT_PUBLIC_OWNER_WA: '919876543210'
      NEXT_PUBLIC_TICKER_JITTER: 'true'
      # Integration suites run against a real database rather than a mock.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Explicit, because the alternative is a coin flip. `pnpm seed` imports
      # `@prisma/client`, which is a stub until `prisma generate` writes the real client into
      # the store. That generation used to happen as a side effect of `pnpm install`'s
      # postinstall, and pnpm caches package side effects — so whether the seed step found a
      # generated client depended on whether the runner got a warm cache. It passed for
      # months and then failed on dbc97d4→e7a0f90, a commit that touched no dependency.
      # Generating here makes the run deterministic instead of cache-shaped.
      - name: Generate the Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Create and migrate the test database
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d postgres -c 'CREATE DATABASE ci_test;'
          # Both URLs, for the same reason as above: overriding only DATABASE_URL would
          # migrate the test database while `directUrl` still pointed at the other one.
          DATABASE_URL="$TEST_DATABASE_URL" MIGRATE_DATABASE_URL="$TEST_DATABASE_URL" \
            pnpm exec prisma migrate deploy

      - name: Seed (twice — must be idempotent, Phase 1 §1.6)
        run: |
          pnpm seed
          pnpm seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck + build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      # The E2E suite runs against `pnpm dev` so it can audit the dev-only /__design
      # gallery, which means it structurally cannot verify the production guard.
      - name: Production guard (/__design must 404 in prod)
        run: ./scripts/verify-production-guard.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A `celery` job ran here until 2026-08-11. It installed backend/requirements.txt and
  # asserted `health.ping` returned "pong" — a tripwire guarding 01-cleanup-scaffold
  # criterion 3, so that deleting the dormant worker as dead code would fail CI loudly.
  # The worker was removed deliberately (MASTER-SPEC §2, D-042), so the tripwire went with
  # it. Jobs run in Node now and are covered by the `test` job above.
